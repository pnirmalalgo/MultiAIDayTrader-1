[unix_http_server]
file=/var/run/supervisord.sock   ; path to the socket
chmod=0700                       ; socket permissions

[supervisord]
nodaemon=true
logfile=/app/logs/supervisord.log
loglevel=info
pidfile=/var/run/supervisord.pid
childlogdir=/app/logs


[program:redis]
command=redis-server --daemonize no
autostart=true
autorestart=true
stdout_logfile=/app/logs/redis.log
stderr_logfile=/app/logs/redis_error.log

[program:celery]
command=celery -A tasks.executor worker --loglevel=info --pool=solo
directory=/app
autostart=true
autorestart=true
stdout_logfile=/app/logs/celery.log
stderr_logfile=/app/logs/celery_error.log
stopwaitsecs=60

[program:fastapi]
command=uvicorn app:app --host 0.0.0.0 --port 8000
directory=/app
autostart=true
autorestart=true
stdout_logfile=/app/logs/fastapi.log
stderr_logfile=/app/logs/fastapi_error.log


[program:gradio]
command=python gradio_ui.py
directory=/app
autostart=true
autorestart=true
stdout_logfile=/app/logs/gradio.log
stderr_logfile=/app/logs/gradio_error.log

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisord.sock
